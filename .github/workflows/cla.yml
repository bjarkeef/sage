# Contributor Licence Agreement check.
#
# Runs against external pull requests and blocks merge until the author has
# signed CLA.md. Signatures are stored in THIS repository, on a dedicated
# `cla-signatures` branch — there is no third-party CLA service holding the
# record, which matches the project's own "your data, your server" stance.
#
# One-time setup before this can pass:
#   git switch --orphan cla-signatures
#   git commit --allow-empty -m "chore: initialise CLA signature store"
#   git push -u origin cla-signatures
#   git switch main
#
# `pull_request_target` is required rather than `pull_request`: a pull request
# from a fork runs with a read-only token, and this job has to write the
# signature file. It is safe here because the job never checks out or executes
# the PR's code — it only reads comment text and writes a JSON file.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only act on PR comments (not issue comments) and on PRs themselves.
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: Check or record CLA signature
        # Pinned to an immutable commit SHA, not a tag: a tag can be re-pointed
        # at new code, and this step holds write permissions.
        #
        # NOTE: contributor-assistant/github-action is ARCHIVED upstream (last
        # release v2.6.1, September 2024). Archived means frozen, not broken —
        # it runs on an ephemeral runner with a token scoped to this repository
        # and does nothing but read comment text and write one JSON file. It was
        # still chosen over the alternatives because blocking the merge is the
        # whole point, and the only actively maintained tool in this space (the
        # DCO app) grants no relicensing rights, which is what the CLA is for.
        #
        # If it ever stops working, the fallback is the PR-template checkbox
        # plus a manual check — see docs/DEPLOYMENT.md.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/v1/cla.json"
          path-to-document: "https://github.com/bjarkeef/sage/blob/main/CLA.md"
          branch: "cla-signatures"
          # Exact phrases. Keep in sync with the "How to sign" section of CLA.md.
          custom-notsigned-prcomment: >
            Thanks for the contribution. Before this can be merged, please read
            the [Contributor Licence Agreement](https://github.com/bjarkeef/sage/blob/main/CLA.md)
            and, if you agree, post a comment on this pull request with exactly:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you."
          # The copyright holder does not sign an agreement with themselves, and
          # bots cannot hold copyright. `*[bot]` covers dependabot/renovate.
          allowlist: bjarkeef,*[bot]
